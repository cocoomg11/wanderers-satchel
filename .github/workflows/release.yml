name: Release

on:
  release:
    types: [published]
  # Manual run: builds module.zip as a workflow artifact without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Release tags must be vMAJOR.MINOR.PATCH (v0.1.0, not 0.1 or v0.1): the version and download URL below come from the tag.
      - name: Check the release tag format
        if: github.event_name == 'release'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad release tag::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (for example v0.1.0). Delete the release and tag, then publish again with a tag like v0.1.0."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME OK"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendored wanderers-core matches its pin
        run: node vendor/wanderers-core/vendor.mjs verify --remote

      - name: Tests
        run: |
          npm run check
          npm test

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles vendor README.md CHANGELOG.md LICENSE \
            -x 'vendor/wanderers-core/config/*' 'vendor/wanderers-core/vendor.mjs' 'vendor/wanderers-core/testing/*'
          unzip -l module.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

      - name: Keep module.zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: module.zip
